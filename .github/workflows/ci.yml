name: CI

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Install ptxas (no GPU needed to validate PTX)
        run: python -m pip install nvidia-cuda-nvcc-cu12
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Verification suite
        run: python tools/run_tests.py -v
      - name: Fuzzing
        run: python tools/fuzz.py -n 400 --seed ${{ github.run_number }}000
      - name: Mutation testing
        run: python tools/mutate.py --fuzz 100
      - name: Benchmark
        run: python tools/bench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            MUTATION_REPORT.md
            fuzz_failures/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build (MSVC)
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Unit tests
        run: build\bin\kernc_unit_tests.exe
      - name: Verification suite
        run: python tools\run_tests.py
      - name: Fuzzing
        run: python tools\fuzz.py -n 150
